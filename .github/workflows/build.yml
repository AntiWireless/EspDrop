# EspDrop - builds: the ESP32-C5 firmware with ESP-IDF, then the app compiled
# with Nuitka (Python -> C) for Windows and Linux with that firmware inside,
# and the tests. A tag v* also drafts a GitHub release with the files.
#
# SPDX-License-Identifier: GPL-3.0-or-later
# Copyright (C) 2026  EspDrop contributors

name: build

on:
  push:
    branches: [main, test]
    tags: ["v*"]
    paths: ["host/**", "firmware/**", "tools/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["host/**", "firmware/**", "tools/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: firmware (ESP32-C5)
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.3
    steps:
      - uses: actions/checkout@v4
      - name: Build the bridge
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware/spikes
          idf.py -B build_c5_bridge -DSDKCONFIG=build_c5_bridge/sdkconfig -DIDF_TARGET=esp32c5 \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.bridge.defaults" build
      - name: One image of the whole flash
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python tools/firmware_image.py firmware/spikes/build_c5_bridge -o espdrop-esp32c5.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: espdrop-esp32c5.bin
          if-no-files-found: error

  test:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Libraries (libarchive; what Qt needs offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive13t64 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: The venv with the patched OpenDrop
        run: python tools/opendrop_install.py --venv "$RUNNER_TEMP/venv"
      - name: Host tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s host/tests'
      - name: Firmware host tests (protocol logic, no ESP)
        run: make -C firmware/spikes/components/awdl/test/host run

  app:
    name: app (${{ matrix.name }})
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04          # the oldest glibc we build on: runs on newer ones
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: build/firmware
      - name: Libraries (Linux)
        if: runner.os == 'Linux'
        # libarchive and Qt's X11 plugin's xcb libraries go into the program
        # (users need not install them); xvfb for the start test under X11.
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive13 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 libxcb-util1 xvfb
      - name: The venv with the patched OpenDrop, and Nuitka
        shell: bash
        run: |
          python tools/opendrop_install.py --venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = Windows ]; then PY="$RUNNER_TEMP/venv/Scripts/python.exe"; else PY="$RUNNER_TEMP/venv/bin/python"; fi
          "$PY" -m pip install -q nuitka zstandard   # zstandard: the single file's packing
          if [ "$RUNNER_OS" = Linux ]; then "$PY" -m pip install -q patchelf; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
      - name: Compile (Nuitka) and check the program
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then export PATH="$RUNNER_TEMP/venv/bin:$PATH"; fi
          "$PY" tools/build_app.py --firmware build/firmware/espdrop-esp32c5.bin --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: EspDrop-${{ matrix.name }}
          path: |
            build/EspDrop-*
            build/THIRD_PARTY-*.txt
          if-no-files-found: error

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, test, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4             # the release text (first: it cleans the folder)
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true                         # published by hand, after a look
          name: EspDrop ${{ github.ref_name }}
          body_path: docs/RELEASE.md
          files: dist/*
